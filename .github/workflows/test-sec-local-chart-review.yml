name: TEST SEC local chart review (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'company-investment-analysis.html'
      - 'src/market/sec-local-chart-review.mjs'
      - 'tests/sec-local-chart-review.test.mjs'
      - '.github/workflows/test-sec-local-chart-review.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sec-local-chart-review.test.mjs
