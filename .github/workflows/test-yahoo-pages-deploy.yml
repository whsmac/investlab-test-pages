name: TEST Yahoo auto prices to GitHub Pages (TEST ONLY)
# Runs on default branch; reads reviewed TEST feature code. No Supabase access.
# 2026-11-24: TEST backup safety release, CI 4/4 passed; previous implementation 04bfe22214697c3ad8777893bcf79f55c22a6b54 retained for rollback.
# No actual server restore; review-only. Backup download retained.
# Previous publisher d48715afde75f9ac20d5a8ddddf59a2844599c71 / implementation b91c0d4fa8d4b501a19ee0315ec8419ca9a64387 retained for rollback.
# 2026-11-23: Refresh TEST pages after fixing ^TNX Yahoo yield percent (do not divide by 10).
# Re-run from a fresh Actions run to avoid duplicate github-pages artifact from prior failed retry.
# 2026-11-24: Recheck SEC collection after repository secret was corrected (TEST only).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/test-yahoo-pages-deploy.yml']
  schedule:
    - cron: '35 23 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: investlab-test-pages-yahoo-deployment
  cancel-in-progress: false

jobs:
  publish-validated-test-site:
    if: github.repository == 'whsmac/investlab-test-pages' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout TEST-only reviewed implementation
        uses: actions/checkout@v4
        with:
          ref: 19e4e5589bb75c460fbbd2fe62033d9ae5a952b3
          persist-credentials: false
      - name: Python for read-only Yahoo collection and offline checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch five Yahoo closing-price series (no database writes)
        run: python scripts/yahoo_price_probe_test.py
      - name: Reject incomplete or stale observations
        run: |
          python -m scripts.build_yahoo_review_candidate --input yahoo-price-probe.json --output yahoo-price-review-candidate.json
          python -m scripts.check_yahoo_publication_preflight --candidate yahoo-price-review-candidate.json --report yahoo-publication-preflight.json
          python -m scripts.build_gated_yahoo_public_review --candidate yahoo-price-review-candidate.json --output yahoo-public-review.json
          python -m scripts.report_yahoo_feed_coverage --source yahoo-public-review.json --output yahoo-feed-coverage.json
      - name: Preserve reviewed SEC snapshot without repeating blocked SEC requests
        run: |
          test "$(git rev-parse HEAD)" = "19e4e5589bb75c460fbbd2fe62033d9ae5a952b3"
          test -s data/sec-financial-review-20261124.txt
          echo "62af62179792df99f45a4b1b5e81a900778f9ee16c8d9dbdb8a90827866ac1b8  data/sec-financial-review-20261124.txt" | sha256sum -c -
          echo "::notice::SEC review snapshot as of 2026-11-24 retained; automated acquisition is paused pending verified access"
      - name: Collect public BITU TQQQ USD ETF closes for complete Pilot valuation (optional)
        run: |
          if ! python -m scripts.portfolio_etf_quotes_test --output "${RUNNER_TEMP}/portfolio-etf-quotes.json"; then
            rm -f "${RUNNER_TEMP}/portfolio-etf-quotes.json"
            echo "::warning::ETF daily closing prices incomplete; keep conservative incomplete valuation, never use a stale value"
          fi
      - name: Fetch real NASDAQ 100 and S&P 500 index levels (optional, read-only)
        run: |
          if ! python -m scripts.yahoo_market_indices_test --output "${RUNNER_TEMP}/market-index-benchmarks.json"; then
            rm -f "${RUNNER_TEMP}/market-index-benchmarks.json"
            echo "::warning::Benchmark source unavailable; do not substitute ETF or stale levels"
          fi
      - name: Probe daily market trends for 11 sectors and three indicators (optional, read-only)
        run: |
          if ! python -m scripts.yahoo_market_trends_test --output "${RUNNER_TEMP}/market-trends-public-review.json"; then
            rm -f "${RUNNER_TEMP}/market-trends-public-review.json"
            echo "::warning::TEST market trends source unavailable; do not publish invented prices"
          fi
      - name: Stage reviewed public-only data
        run: python -m scripts.stage_yahoo_test_pages_asset --source yahoo-public-review.json --directory yahoo-staged
      - name: Assemble and validate complete TEST website (no partial publishing)
        run: |
          python -m scripts.assemble_yahoo_test_site_preview --repo . --staging yahoo-staged --output "${RUNNER_TEMP}/investlab-test-pages-site"
          python -m scripts.validate_yahoo_test_site_preview --site "${RUNNER_TEMP}/investlab-test-pages-site"
          test -s "${RUNNER_TEMP}/investlab-test-pages-site/data/sec-financial-review-20261124.txt"
          test -s "${RUNNER_TEMP}/investlab-test-pages-site/src/ledger/pilot-backup-restore-review.mjs"
          grep -q "서버 복원 사전점검" "${RUNNER_TEMP}/investlab-test-pages-site/data-management.html"
          echo "62af62179792df99f45a4b1b5e81a900778f9ee16c8d9dbdb8a90827866ac1b8  ${RUNNER_TEMP}/investlab-test-pages-site/data/sec-financial-review-20261124.txt" | sha256sum -c -
      - name: Stage and validate optional index data
        run: |
          if [ -s "${RUNNER_TEMP}/market-index-benchmarks.json" ]; then
            mkdir -p "${RUNNER_TEMP}/investlab-test-pages-site/data"
            cp "${RUNNER_TEMP}/market-index-benchmarks.json" "${RUNNER_TEMP}/investlab-test-pages-site/data/market-index-benchmarks.json"
            if ! python -m scripts.validate_yahoo_test_site_preview --site "${RUNNER_TEMP}/investlab-test-pages-site"; then
              rm -f "${RUNNER_TEMP}/investlab-test-pages-site/data/market-index-benchmarks.json"
              python -m scripts.validate_yahoo_test_site_preview --site "${RUNNER_TEMP}/investlab-test-pages-site"
              echo "::warning::Invalid index asset excluded from TEST website"
            fi
          fi
      - name: Stage and validate optional market trends observations
        run: |
          if [ -s "${RUNNER_TEMP}/market-trends-public-review.json" ]; then
            mkdir -p "${RUNNER_TEMP}/investlab-test-pages-site/data"
            cp "${RUNNER_TEMP}/market-trends-public-review.json" "${RUNNER_TEMP}/investlab-test-pages-site/data/market-trends-public-review.json"
            if ! python -m scripts.validate_yahoo_test_site_preview --site "${RUNNER_TEMP}/investlab-test-pages-site"; then
              rm -f "${RUNNER_TEMP}/investlab-test-pages-site/data/market-trends-public-review.json"
              python -m scripts.validate_yahoo_test_site_preview --site "${RUNNER_TEMP}/investlab-test-pages-site"
              echo "::warning::Invalid market trends observations excluded from TEST site"
            fi
          fi
      - name: Stage and validate public-only ETF closes (no holdings or user data)
        run: |
          if [ -s "${RUNNER_TEMP}/portfolio-etf-quotes.json" ]; then
            mkdir -p "${RUNNER_TEMP}/investlab-test-pages-site/data"
            cp "${RUNNER_TEMP}/portfolio-etf-quotes.json" "${RUNNER_TEMP}/investlab-test-pages-site/data/portfolio-etf-quotes.json"
            if ! python -m scripts.validate_yahoo_test_site_preview --site "${RUNNER_TEMP}/investlab-test-pages-site"; then
              rm -f "${RUNNER_TEMP}/investlab-test-pages-site/data/portfolio-etf-quotes.json"
              python -m scripts.validate_yahoo_test_site_preview --site "${RUNNER_TEMP}/investlab-test-pages-site"
              echo "::warning::ETF quote snapshot did not pass publication gates and was excluded"
            fi
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete validated site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/investlab-test-pages-site
      - name: Allow uploaded TEST Pages artifact to become discoverable
        run: sleep 18
      - name: Deploy TEST Pages only after all checks succeed
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-yahoo-auto-price-evidence
          path: |
            yahoo-price-probe.json
            yahoo-price-review-candidate.json
            yahoo-publication-preflight.json
            yahoo-feed-coverage.json
            yahoo-public-review.json
            data/sec-financial-review-20261124.txt
          if-no-files-found: warn
          retention-days: 7
