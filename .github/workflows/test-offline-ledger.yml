  workflow_dispatch:
jobs:
  yahoo-pages-live-source-audit:
    name: TEST Pages live evidence (read-only, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/test-navigation-20261112
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect actual TEST Pages source
        run: python -m scripts.audit_yahoo_test_pages_source --output pages-source.json
      - name: Inspect live Yahoo TEST file
        run: python -m scripts.verify_yahoo_test_pages_live --report-only --output pages-live.json
      - name: Inspect TEST branch assets
        run: python -m scripts.audit_yahoo_test_pages_branch --output pages-branches.json
      - name: Summarize online state
        run: |
          python -m scripts.report_yahoo_online_readiness \
            --branch-audit pages-branches.json \
            --pages-source pages-source.json \
            --live-check pages-live.json \
            --output pages-readiness.json
      - name: Report actual blockers to TEST online Yahoo activation
        run: |
          python -m scripts.report_yahoo_test_activation_blockers \
            --pages-source pages-source.json \
            --online-readiness pages-readiness.json \
            --output pages-activation-blockers.json
      - name: Preserve read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-pages-live-source-evidence
          path: |
            pages-source.json
            pages-live.json
            pages-branches.json
            pages-readiness.json
            pages-activation-blockers.json
          if-no-files-found: warn
          retention-days: 7

  ledger-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate TEST price source pipeline offline
        run: python -m unittest discover -s tests -p 'test_price*.py' -v
      - name: Validate TEST shared price snapshot (mocked)
        run: node --test tests/yahoo-portfolio-valuation-ui.test.mjs tests/yahoo-axes-chart.test.mjs tests/test-price-snapshot.mjs
      - name: Validate read-only latest Yahoo prices and stale blocking
        run: node --test tests/yahoo-online-feed-status.test.mjs
          node --test tests/test-yahoo-latest-prices.mjs
      - name: Validate Yahoo-to-portfolio price fill preserves user inputs
        run: node --test tests/yahoo-portfolio-price-fill.test.mjs
      - name: Validate Yahoo portfolio UI wiring and module syntax
        run: node --test tests/yahoo-portfolio-ui.test.mjs
      - name: Validate offline Yahoo-to-portfolio valuation integration
        run: node --test tests/yahoo-portfolio-valuation-preview.test.mjs
      - name: Validate TEST Yahoo company mapping (mocked)
        run: node --test tests/test-yahoo-test-company-map.mjs
      - name: Validate TEST Yahoo browser comparison (mocked)
        run: node --test tests/test-yahoo-test-browser-review.mjs
      - name: Validate Yahoo artifact discovery (mocked)
        run: node --test tests/test-yahoo-artifact-discovery.mjs
      - name: Validate published Yahoo JSON loader (mocked)
        run: node --test tests/test-yahoo-published-loader.mjs
      - name: Validate TEST Yahoo Pages no-deploy workflow
        run: node --test tests/test-yahoo-pages-review-workflow.mjs
      - name: Validate Yahoo browser page source precedence
        run: node --test tests/test-yahoo-browser-page-contract.mjs
      - name: Validate read-only TEST Supabase schema diagnostics
        run: node --test tests/test-yahoo-schema-diagnostic.mjs
      - name: Validate safe TEST schema diagnostic export
        run: node --test tests/test-yahoo-schema-report.mjs
      - name: Validate automatic Yahoo review mini chart series
        run: node --test tests/test-yahoo-review-chart-series.mjs
      - name: Validate Yahoo chart data freshness
        run: node --test tests/test-yahoo-chart-freshness.mjs
      - name: Probe Yahoo Finance first (read-only, non-blocking)
        continue-on-error: true
        timeout-minutes: 2
        run: python -u scripts/yahoo_price_probe_test.py
      - name: Validate Yahoo data for review-only candidate
        if: always()
        continue-on-error: true
        run: python scripts/build_yahoo_review_candidate.py
      - name: Upload Yahoo review-only candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-yahoo-review-candidate
          path: yahoo-price-review-candidate.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Check Yahoo publication readiness (no deployment)
        if: always()
        continue-on-error: true
        run: |
          if [ -f yahoo-price-review-candidate.json ]; then
            python -m scripts.check_yahoo_publication_preflight --candidate yahoo-price-review-candidate.json --report yahoo-publication-preflight.json
          fi
      - name: Upload Yahoo publication readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-yahoo-publication-preflight
          path: yahoo-publication-preflight.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Build public-safe Yahoo browser snapshot (no deployment)
        if: always()
        continue-on-error: true
        run: |
          if [ -f yahoo-price-review-candidate.json ]; then
            python -m scripts.build_gated_yahoo_public_review --candidate yahoo-price-review-candidate.json --output yahoo-public-review.json
          fi
      - name: Upload browser-ready Yahoo JSON (not published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-yahoo-browser-json
          path: yahoo-public-review.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage Yahoo JSON for future TEST Pages review (no deployment)
        if: always()
        continue-on-error: true
        run: |
          if [ -f yahoo-public-review.json ]; then
            python -m scripts.stage_yahoo_test_pages_asset --source yahoo-public-review.json --directory yahoo-test-pages-staging
          fi
      - name: Upload TEST Pages staging package (not published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-yahoo-pages-staging
          path: yahoo-test-pages-staging/
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble complete TEST site preview (no deployment)
        if: always()
        continue-on-error: true
        run: |
          if [ -f yahoo-test-pages-staging/manifest.json ]; then
            python -m scripts.assemble_yahoo_test_site_preview --repo . --staging yahoo-test-pages-staging --output /tmp/investlab-yahoo-site-preview
          fi
      - name: Validate complete TEST site preview assets and imports
        if: always()
        run: |
          if [ -f /tmp/investlab-yahoo-site-preview/data/yahoo-public-review.json ]; then
            python -m scripts.validate_yahoo_test_site_preview --site /tmp/investlab-yahoo-site-preview
          fi
      - name: Report complete TEST site readiness (no deployment)
        if: always()
        run: python -m scripts.report_yahoo_test_bundle_readiness --site /tmp/investlab-yahoo-site-preview --output yahoo-test-site-readiness.json
      - name: Check TEST Pages manual publication handoff (NO DEPLOY)
        if: always()
        run: |
          if [ -f /tmp/investlab-yahoo-site-preview/data/yahoo-public-review.json ]; then
            python -m scripts.check_yahoo_test_pages_handoff --readiness yahoo-test-site-readiness.json --site /tmp/investlab-yahoo-site-preview --reviewed-commit "${{ github.sha }}" --output yahoo-test-pages-handoff.json
          fi
      - name: Upload TEST Pages manual handoff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-yahoo-pages-handoff
          path: yahoo-test-pages-handoff.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload TEST site readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-yahoo-site-readiness
          path: yahoo-test-site-readiness.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload complete TEST site preview (not published)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-yahoo-complete-site-preview
          path: /tmp/investlab-yahoo-site-preview/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Yahoo trial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-yahoo-probe
          path: yahoo-price-probe.json
          if-no-files-found: warn
          retention-days: 7
      - name: Probe live free price source (read-only, non-blocking)
        id: live_price_probe
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/market_price_refresh_test.py
      - name: Summarize free price source diagnostics
        if: always()
        run: python scripts/summarize_price_probe_test.py
      - name: Upload price-source trial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-price-probe
          path: price-source-probe.json
          if-no-files-found: warn
          retention-days: 7
