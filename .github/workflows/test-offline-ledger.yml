name: TEST offline ledger checks
on:
  pull_request:
    paths:
      - 'src/ledger/**'
      - 'tests/offline-ledger-check.test.mjs'
      - '.github/workflows/test-offline-ledger.yml'
  workflow_dispatch:
jobs:
  ledger-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check offline ledger invariants
        run: node --test tests/offline-ledger-check.test.mjs
