name: TEST common TradingView chart popup (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/ui/pilot-tradingview-chart.mjs'
      - 'tests/pilot-tradingview-chart.browser.test.mjs'
      - 'tests/pilot-tradingview-live-smoke.mjs'
      - '.github/workflows/test-pilot-tradingview-chart.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node --test tests/pilot-tradingview-chart.browser.test.mjs tests/pilot-ledger-usage-order.browser.test.mjs
      - name: Actual public BITU chart rendering (external network diagnostic)
        continue-on-error: true
        run: node tests/pilot-tradingview-live-smoke.mjs
