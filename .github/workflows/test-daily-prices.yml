name: INVESTLAB TEST daily prices
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
permissions:
  contents: read
jobs:
  sync-test-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and sync latest TEST closing prices
        env:
          INVESTLAB_TEST_SUPABASE_URL: ${{ secrets.INVESTLAB_TEST_SUPABASE_URL }}
          INVESTLAB_TEST_SUPABASE_SERVICE_KEY: ${{ secrets.INVESTLAB_TEST_SUPABASE_SERVICE_KEY }}
          INVESTLAB_ENABLE_TEST_PRICE_WRITES: ${{ vars.INVESTLAB_ENABLE_TEST_PRICE_WRITES }}
        run: node scripts/sync-test-daily-prices.mjs
