name: TEST SEC quarterly ZIP review (NO DEPLOY)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/sec_fsds_quarterly_review.py'
      - 'tests/test_sec_fsds_quarterly_review.py'
      - '.github/workflows/test-sec-fsds-quarterly-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile scripts/sec_fsds_quarterly_review.py
          python -m unittest discover -s tests -p 'test_sec*.py' -v
  one-off-official-archive:
    needs: offline
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.repository == 'whsmac/investlab-test-pages' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/pilot-sec-quarterly-zip-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One request only for official 2026 Q3 archive (no retries)
        env:
          INVESTLAB_SEC_USER_AGENT: ${{ secrets.INVESTLAB_SEC_USER_AGENT }}
        run: |
          if [ -z "$INVESTLAB_SEC_USER_AGENT" ]; then
            echo "::warning::Contact secret unavailable; no request sent"
            exit 1
          fi
          python -m scripts.sec_fsds_quarterly_review --download 2026q3 --directory "$RUNNER_TEMP/fsds" --output "$RUNNER_TEMP/sec-fsds-review.json"
      - name: Retain review-only extracted facts; never upload original ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sec-fsds-review-only
          path: ${{ runner.temp }}/sec-fsds-review.json
          retention-days: 7
