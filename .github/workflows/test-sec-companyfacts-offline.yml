name: TEST SEC offline Company Facts (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'scripts/sec_companyfacts_offline_review.py'
      - 'tests/test_sec_companyfacts_offline_review.py'
      - '.github/workflows/test-sec-companyfacts-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile scripts/sec_companyfacts_offline_review.py
          python -m unittest discover -s tests -p 'test_sec*.py' -v
