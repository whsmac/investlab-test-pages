name: TEST Yahoo daily review candidate (NO DEPLOY)
# Inert on feature branch. GitHub schedules execute from the default branch only.
# This workflow must not be enabled/published without a separate approval.
on:
  schedule:
    - cron: '35 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investlab-test-yahoo-review-only
  cancel-in-progress: false

jobs:
  prepare-test-yahoo-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Yahoo 5-ticker observations (read-only)
        id: probe
        continue-on-error: true
        run: python scripts/yahoo_price_probe_test.py
      - name: Validate and sanitize review-only candidate
        if: steps.probe.outcome == 'success'
        id: candidate
        continue-on-error: true
        run: |
          python -m scripts.build_yahoo_review_candidate --input yahoo-price-probe.json --output yahoo-price-review-candidate.json
          python -m scripts.check_yahoo_publication_preflight --candidate yahoo-price-review-candidate.json --report yahoo-publication-preflight.json
          python -m scripts.build_gated_yahoo_public_review --candidate yahoo-price-review-candidate.json --output yahoo-public-review.json
      - name: Checkout current TEST Pages branch into read-only comparison directory
        if: steps.candidate.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: test-pages-current
          persist-credentials: false
      - name: Compare proposed JSON against current TEST Pages (NO DEPLOY)
        if: steps.candidate.outcome == 'success'
        id: comparison
        continue-on-error: true
        run: |
          python -m scripts.review_yahoo_test_pages_refresh --current-site test-pages-current --proposed-json yahoo-public-review.json --output yahoo-pages-refresh-review.json
      - name: Upload review-only diagnostic and candidate (NO DEPLOY)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investlab-test-yahoo-daily-review
          path: |
            yahoo-price-probe.json
            yahoo-price-review-candidate.json
            yahoo-publication-preflight.json
            yahoo-public-review.json
            yahoo-pages-refresh-review.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when collection or validation was blocked
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          if [ "$PROBE_OUTCOME" != success ] || [ "$CANDIDATE_OUTCOME" != success ] || [ "$COMPARISON_OUTCOME" != success ]; then
            echo "::error::Yahoo review failed; no data was published or written."
            exit 1
          fi
          echo "Review-only artifact prepared; no deployment or database writes."
