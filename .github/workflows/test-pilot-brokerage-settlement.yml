name: TEST brokerage settlement ledger (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/ledger/pilot-brokerage-settlement.mjs'
      - 'src/ledger/pilot-ledger-validation.mjs'
      - 'src/ledger/pilot-portfolio-projection.mjs'
      - 'src/ledger/pilot-portfolio-history.mjs'
      - 'pilot-ledger.html'
      - 'tests/pilot-brokerage-settlement.test.mjs'
      - '.github/workflows/test-pilot-brokerage-settlement.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pilot-brokerage-settlement.test.mjs tests/pilot-ledger-validation.test.mjs tests/pilot-ledger-cross-module-consistency.test.mjs tests/pilot-portfolio-history.test.mjs tests/pilot-visual-performance.test.mjs
