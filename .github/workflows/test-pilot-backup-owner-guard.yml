name: TEST Pilot backup and owner guard (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'virtual-trade-simulator.html'
      - 'src/ledger/scenario-backup.mjs'
      - 'tests/pilot-backup-owner-guard.test.mjs'
      - '.github/workflows/test-pilot-backup-owner-guard.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --test tests/pilot-backup-owner-guard.test.mjs tests/scenario-backup.test.mjs tests/multi-user-ledger-isolation.test.mjs tests/pilot-cross-device-audit.test.mjs tests/online-ledger-export.test.mjs tests/test-simulator-ledger-session-safety.test.mjs
