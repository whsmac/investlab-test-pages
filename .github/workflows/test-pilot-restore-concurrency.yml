name: TEST concurrent ledger restore PostgreSQL (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'tests/postgres/atomic_restore_concurrency*'
      - 'tests/postgres/atomic_restore_fixture_*.sql'
      - '.github/workflows/test-pilot-restore-concurrency.yml'
permissions:
  contents: read
jobs:
  isolated-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent disposable PostgreSQL sessions
        run: |
          set -eu
          docker run --rm -d --name investlab-restore-concurrency -e POSTGRES_PASSWORD=fixture-local-only -v "$PWD/tests/postgres:/fixture:ro" postgres:16
          trap 'docker rm -f investlab-restore-concurrency >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec investlab-restore-concurrency pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec investlab-restore-concurrency psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f /fixture/atomic_restore_concurrency_setup.sql
          python3 tests/postgres/atomic_restore_concurrency.py
