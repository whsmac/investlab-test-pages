name: TEST Pilot ledger backup restore review (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'data-management.html'
      - 'src/ledger/pilot-backup-restore-review.mjs'
      - 'tests/pilot-ledger-backup-restore-review.test.mjs'
      - '.github/workflows/test-pilot-ledger-backup-restore-review.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pilot-ledger-backup-restore-review.test.mjs tests/pilot-ledger-validation.test.mjs tests/pilot-backup-owner-guard.test.mjs tests/scenario-backup.test.mjs tests/pilot-cross-device-audit.test.mjs
