<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST · 포트폴리오 이관 사전점검</title><style>body{font:16px system-ui;background:#0b1020;color:#eef3ff;margin:0}main{max-width:880px;margin:auto;padding:24px 16px}a{color:#a6c5ff}section{border:1px solid #34435d;border-radius:14px;padding:18px;margin:18px 0;background:#151d30}button{background:#284a80;color:white;border:1px solid #6987b2;border-radius:8px;padding:12px;cursor:pointer}p{line-height:1.65;color:#becae1}pre{white-space:pre-wrap;overflow-wrap:anywhere}strong{color:#fff}.warn{color:#f8d18c}</style></head><body><main><a href="./portfolio-connection-check.html">← 연결 진단</a><h1>포트폴리오 이관 사전점검</h1><p>현재 TEST 사이트의 브라우저 저장소를 <strong>읽기만</strong> 합니다. 기존 대시보드가 다른 도메인이라면 해당 데이터는 자동으로 읽을 수 없습니다. 어떠한 데이터도 서버에 전송하거나 저장하지 않습니다.</p><section><h2>보유종목 구조 확인</h2><button id="check" type="button">현재 사이트 데이터 점검</button><p id="status" role="status">아직 실행하지 않았습니다.</p><pre id="result"></pre></section><section><h2>계좌별 기초잔고 미리보기</h2><p><a href="./opening-snapshot-preview.html">보유주식·현금잔고 입력 및 검증 화면 열기 →</a></p></section><section><h2>이관 전 확인사항</h2><p class="warn">인식된 종목이 있어도 이관 가능 상태를 의미하지 않습니다. 계좌별 배분, 현금 기초잔고, 취득원가와 인증 권한을 검증한 뒤에만 실제 이관 기능을 만들 예정입니다.</p></section></main><script type="module">import {assessPortfolioMigration} from './src/ledger/portfolio-migration-assessment.mjs';const by=id=>document.getElementById(id);by('check').addEventListener('click',()=>{try{const raw=localStorage.getItem('investlab_holdings');const holdings=raw===null?[]:JSON.parse(raw);const r=assessPortfolioMigration({holdings});by('status').textContent='점검 완료 · '+r.sourceCount+'건 중 '+r.recognizedCount+'건 구조 인식 · 서버 전송 없음';by('result').textContent=r.warnings.length?r.warnings.join('\n'):'형식 경고 없음. 계좌 매핑과 취득원가 검증은 별도로 필요합니다.';}catch(e){by('status').textContent='읽기 실패 · 기존 데이터는 변경하지 않았습니다.';by('result').textContent=String(e.message);}});</script></body></html>
