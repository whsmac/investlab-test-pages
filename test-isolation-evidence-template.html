<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST 격리 증거 양식</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0b1020;color:#edf2ff}main{max-width:880px;margin:auto;padding:24px 16px}a{color:#a9c5ff}section{border:1px solid #34445e;border-radius:14px;background:#151d30;padding:18px;margin:16px 0}p{color:#bac7dc;line-height:1.6}button{background:#31538a;border:1px solid #6787b7;color:white;padding:12px 16px;border-radius:8px;cursor:pointer}.bad{color:#fca5a5}</style></head><body><main><a href="./test-ab-isolation-review.html">← A/B 격리 점검</a><h1>실측 증거 기록 양식</h1><p>TEST 프로젝트 전용 8개 항목의 빈 증거 양식을 다운로드합니다. 실제 시험 수행 및 계정 생성은 별도 승인 대상입니다.</p><section><button id="download">TEST 증거 양식 JSON 저장</button><p id="status" role="status">아직 다운로드하지 않았습니다.</p><p class="bad">양식 다운로드는 서버 검증이 아닙니다. 계정·토큰·개인자료를 기록하지 마세요.</p></section><p><a href="https://github.com/whsmac/investlab-test-pages/blob/feature/test-navigation-20261112/docs/test-ab-isolation-runbook-DO-NOT-EXECUTE.md">실제 시험 절차서 보기</a></p></main><script type="module">
import {buildIsolationEvidenceTemplate} from './src/ledger/isolation-evidence-template.mjs';
document.getElementById('download').onclick=()=>{const obj=buildIsolationEvidenceTemplate(),blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='investlab-test-isolation-evidence-template.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='빈 TEST 증거 양식을 저장했습니다. DB 작업 없음.'};
</script></body></html>
