<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST · 계좌별 초기잔고 배정</title><style>body{font:16px system-ui,sans-serif;max-width:980px;margin:28px auto;padding:0 16px;line-height:1.5}textarea{width:100%;min-height:135px;box-sizing:border-box;font:13px monospace}button{padding:10px 16px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f5;padding:14px;border-radius:8px}input{padding:8px}a{color:#245cb5}</style></head><body><nav><a href="./index.html">← TEST 홈</a></nav><h1>계좌별 초기잔고 배정</h1><p>기존 보유종목을 계좌별로 배정하고 현금잔고를 별도 지정합니다. JSON 입력값은 브라우저 내부에서만 처리하며 서버에 전송하지 않습니다.</p><button id="sample">예시 채우기</button><p>기존 보유종목 내보내기 JSON</p><textarea id="export" spellcheck="false"></textarea><p>계좌 목록 JSON (계좌 UUID·이름·소유 확인)</p><textarea id="accounts" spellcheck="false"></textarea><p>종목별 계좌 배정 JSON</p><textarea id="allocations" spellcheck="false"></textarea><p>계좌별 USD/KRW 현금 JSON</p><textarea id="cash" spellcheck="false"></textarea><button id="run">초기잔고 검증</button><button id="save" disabled>검토 결과 JSON 저장</button><p id="status" role="status"></p><pre id="output"></pre><p>주의: 기존 포트폴리오가 계좌별 원가를 제공하지 않으면 동일 종목을 여러 계좌에 배정할 때 평균취득단가는 원본의 종목별 값을 임시 적용합니다. 계좌별 실제 원가 확인 전에는 이관할 수 없습니다.</p><script type="module">
import {allocatePortfolioOpening} from './src/ledger/portfolio-account-allocation.mjs';
const $=id=>document.getElementById(id);let result=null;
$('sample').onclick=()=>{const a='11111111-1111-4111-8111-111111111111',b='22222222-2222-4222-8222-222222222222';$('export').value=JSON.stringify({format:'INVESTLAB_LEGACY_HOLDINGS_JSON',version:1,holdings:[{symbol:'TSLA',shares:'3',avg_cost:'100'}]},null,2);$('accounts').value=JSON.stringify([{id:a,name:'계좌 1',ownerConfirmed:true},{id:b,name:'계좌 2',ownerConfirmed:true}],null,2);$('allocations').value=JSON.stringify([{ticker:'TSLA',accountId:a,quantity:'1'},{ticker:'TSLA',accountId:b,quantity:'2'}],null,2);$('cash').value=JSON.stringify([{accountId:a,currency:'USD',balance:'100'},{accountId:b,currency:'KRW',balance:'10000'}],null,2)};
$('run').onclick=()=>{result=null;$('save').disabled=true;try{for(const id of ['export','accounts','allocations','cash'])if(new TextEncoder().encode($(id).value).length>1048576)throw Error(id+' 입력이 1MiB 초과');result=allocatePortfolioOpening({exportData:JSON.parse($('export').value),accounts:JSON.parse($('accounts').value),allocations:JSON.parse($('allocations').value),cash:JSON.parse($('cash').value)});$('status').textContent=result.status+' · 검토 필요 '+result.warnings.length+'건';$('output').textContent=JSON.stringify({accounts:result.accounts,openingRows:result.openingRows,warnings:result.warnings,canMigrate:result.canMigrate},null,2);$('save').disabled=false}catch(e){$('status').textContent='검증 중단: '+e.message;$('output').textContent=''}};
$('save').onclick=()=>{if(!result)return;const blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='investlab-test-opening-account-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
