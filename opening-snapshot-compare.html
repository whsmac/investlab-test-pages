<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST · 계좌별 기초잔고 대조</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0b1020;color:#edf2ff}body{margin:0}main{max-width:1050px;margin:auto;padding:24px 16px}a{color:#a9c5ff}section{border:1px solid #34445e;border-radius:14px;background:#151d30;padding:18px;margin:16px 0}p{line-height:1.65;color:#bac7dc}textarea{box-sizing:border-box;width:100%;height:210px;background:#0c1526;color:#fff;border:1px solid #50627f;border-radius:8px;padding:12px;font:13px monospace}button{background:#31538a;border:1px solid #6787b7;color:white;padding:12px 16px;border-radius:8px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}td,th{border-bottom:1px solid #33445d;padding:9px;text-align:left;white-space:nowrap}.ok{color:#86efac}.bad{color:#fca5a5}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="./opening-snapshot-guided.html">← 기초잔고 입력</a><h1>계좌별 기초잔고 대조</h1><p>원본 확인자료와 이전 예정자료를 JSON으로 입력하여 계좌별 주식 수량·취득단가 및 USD/KRW 현금잔고를 비교합니다. 모든 계산은 브라우저 안에서만 수행됩니다.</p><section><div class="grid"><label>원본 확인자료<textarea id="source" spellcheck="false" placeholder='{"positions":[{"accountId":"UUID","ticker":"TSLA","quantity":"10","averageCostUsd":"250"}],"cash":[{"accountId":"UUID","currency":"USD","balance":"1000"}]}'></textarea></label><label>이전 예정자료<textarea id="candidate" spellcheck="false" placeholder="동일한 JSON 구조"></textarea></label></div><p>계좌 ID는 양쪽에 동일하게 입력해야 합니다. 계좌 소유권과 취득원가는 별도 확인이 필요합니다.</p><p>간편 입력 화면에서 저장한 비교용 JSON 파일을 선택하면 아래 입력란에 자동으로 채워집니다.</p><label>원본 파일 <input id="sourceFile" type="file" accept=".json,application/json"></label> <label>이전 예정 파일 <input id="candidateFile" type="file" accept=".json,application/json"></label><p id="fileStatus" role="status"></p><button id="compare">계좌별 잔고 비교</button><div><label><input type="checkbox" id="confirmAccount"> 계좌별 소유·배분을 직접 확인했습니다.</label><p></p><label><input type="checkbox" id="confirmCost"> 평균취득단가와 취득원가를 확인했습니다.</label><p></p><label><input type="checkbox" id="confirmCash"> USD/KRW 현금잔고를 확인했습니다.</label></div><button id="review" disabled>TEST 검토 단계 진행 가능 여부 확인</button><button id="downloadReport" disabled>검토보고서 JSON 저장</button><p id="gateStatus" role="status">검토 단계 잠금</p><p id="status" role="status">비교 전</p></section><section><h2>항목별 결과</h2><div class="scroll"><table><thead><tr><th>계좌 ID</th><th>종류</th><th>종목/통화</th><th>원본 수량/잔고</th><th>예정 수량/잔고</th><th>원본 평균단가</th><th>예정 평균단가</th><th>상태</th></tr></thead><tbody id="rows"><tr><td colspan="8">비교 전</td></tr></tbody></table></div></section></main><script type="module">
import {compareOpeningSnapshots} from './src/ledger/opening-snapshot-compare.mjs';
import {assessOpeningMigrationGate} from './src/ledger/opening-migration-gate.mjs';
import {createOpeningReviewReport} from './src/ledger/opening-review-report.mjs';
import {parseOpeningDraft,MAX_SNAPSHOT_BYTES} from './src/ledger/opening-draft-transfer.mjs';
const $=id=>document.getElementById(id);let last=null;
const clearGate=()=>{last=null;$('downloadReport').disabled=true;$('review').disabled=true;$('gateStatus').textContent='검토 단계 잠금 · 비교를 다시 실행하세요';};
for(const id of ['source','candidate'])$(id).addEventListener('input',clearGate);
for(const id of ['confirmAccount','confirmCost','confirmCash'])$(id).addEventListener('change',()=>{if(last)refreshGate();});
function refreshGate(){if(!last)return;try{$('downloadReport').disabled=false;const r=assessOpeningMigrationGate(last.a,last.b,{accountOwnership:$('confirmAccount').checked,historicalCostBasis:$('confirmCost').checked,cashBalances:$('confirmCash').checked});$('review').disabled=!r.readyForTestReview;$('gateStatus').textContent=r.readyForTestReview?'TEST 검토 준비 완료 · 업로드는 허용되지 않습니다':'진행 차단 · 불일치 '+r.differences.length+'건 / 미확인 '+r.missingConfirmations.length+'건';}catch(e){clearGate();$('gateStatus').textContent='검토 오류: '+e.message;}}
$('downloadReport').onclick=()=>{if(!last)return;try{const report=createOpeningReviewReport(last.a,last.b,{accountOwnership:$('confirmAccount').checked,historicalCostBasis:$('confirmCost').checked,cashBalances:$('confirmCash').checked});const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='investlab-opening-review.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('gateStatus').textContent='검토보고서 저장 완료 · DB 업로드 승인 아님';}catch(e){$('gateStatus').textContent='보고서 오류: '+e.message;}};
$('review').onclick=()=>{if(!last)return;refreshGate();if(!$('review').disabled)$('gateStatus').textContent='TEST 검토 조건 충족 · 다음 단계는 별도 승인 필요 (서버 저장 없음)';};
for(const [fileId,targetId] of [['sourceFile','source'],['candidateFile','candidate']]){$(fileId).onchange=async()=>{try{const f=$(fileId).files?.[0];if(!f)return;if(f.size>MAX_SNAPSHOT_BYTES)throw Error('파일 크기가 1MiB를 초과합니다');const data=parseOpeningDraft(await f.text());$(targetId).value=JSON.stringify(data,null,2);clearGate();$('fileStatus').textContent='파일을 검증하여 '+(targetId==='source'?'원본':'이전 예정')+' 입력란에 채웠습니다. 비교 버튼을 누르세요.';}catch(e){$(targetId).value='';$('fileStatus').textContent='파일 오류: '+e.message;}};}
$('compare').onclick=()=>{const body=$('rows');body.replaceChildren();try{const a=JSON.parse($('source').value),b=JSON.parse($('candidate').value),r=compareOpeningSnapshots(a,b);clearGate();last={a,b};refreshGate();for(const item of r.rows){const x=item.source,y=item.candidate,stock=item.kind==='opening_position';const cells=[item.key.split('|')[0],stock?'주식':'현금',stock?(x?.ticker??y?.ticker):(x?.currency??y?.currency),stock?x?.quantity:x?.balance,stock?y?.quantity:y?.balance,stock?x?.averageCostUsd:'—',stock?y?.averageCostUsd:'—',item.status];const tr=document.createElement('tr');for(const v of cells){const td=document.createElement('td');td.textContent=v??'누락';tr.append(td)}tr.lastChild.className=item.status==='MATCH'?'ok':'bad';body.append(tr)}$('status').textContent=(r.status==='ALL_MATCH'?'전체 일치':'차이 확인 필요')+' · 원본 '+r.sourceCount+'건 / 이전 예정 '+r.candidateCount+'건 / 일치 '+r.rows.filter(x=>x.status==='MATCH').length+'건 · 서버 저장 없음';$('status').className=r.status==='ALL_MATCH'?'ok':'bad';}catch(e){clearGate();body.replaceChildren();$('status').textContent='검증 중단: '+e.message;$('status').className='bad';}};
</script></body></html>
