<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST · 계좌별 기초잔고 대조</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0b1020;color:#edf2ff}body{margin:0}main{max-width:1050px;margin:auto;padding:24px 16px}a{color:#a9c5ff}section{border:1px solid #34445e;border-radius:14px;background:#151d30;padding:18px;margin:16px 0}p{line-height:1.65;color:#bac7dc}textarea{box-sizing:border-box;width:100%;height:210px;background:#0c1526;color:#fff;border:1px solid #50627f;border-radius:8px;padding:12px;font:13px monospace}button{background:#31538a;border:1px solid #6787b7;color:white;padding:12px 16px;border-radius:8px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}td,th{border-bottom:1px solid #33445d;padding:9px;text-align:left;white-space:nowrap}.ok{color:#86efac}.bad{color:#fca5a5}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="./opening-snapshot-guided.html">← 기초잔고 입력</a><h1>계좌별 기초잔고 대조</h1><p>원본 확인자료와 이전 예정자료를 JSON으로 입력하여 계좌별 주식 수량·취득단가 및 USD/KRW 현금잔고를 비교합니다. 모든 계산은 브라우저 안에서만 수행됩니다.</p><section><div class="grid"><label>원본 확인자료<textarea id="source" spellcheck="false" placeholder='{"positions":[{"accountId":"UUID","ticker":"TSLA","quantity":"10","averageCostUsd":"250"}],"cash":[{"accountId":"UUID","currency":"USD","balance":"1000"}]}'></textarea></label><label>이전 예정자료<textarea id="candidate" spellcheck="false" placeholder="동일한 JSON 구조"></textarea></label></div><p>계좌 ID는 양쪽에 동일하게 입력해야 합니다. 계좌 소유권과 취득원가는 별도 확인이 필요합니다.</p><button id="compare">계좌별 잔고 비교</button><p id="status" role="status">비교 전</p></section><section><h2>항목별 결과</h2><div class="scroll"><table><thead><tr><th>계좌 ID</th><th>종류</th><th>종목/통화</th><th>원본 수량/잔고</th><th>예정 수량/잔고</th><th>원본 평균단가</th><th>예정 평균단가</th><th>상태</th></tr></thead><tbody id="rows"><tr><td colspan="8">비교 전</td></tr></tbody></table></div></section></main><script type="module">
import {compareOpeningSnapshots} from './src/ledger/opening-snapshot-compare.mjs';
const $=id=>document.getElementById(id);
$('compare').onclick=()=>{const body=$('rows');body.replaceChildren();try{const a=JSON.parse($('source').value),b=JSON.parse($('candidate').value),r=compareOpeningSnapshots(a,b);for(const item of r.rows){const x=item.source,y=item.candidate,stock=item.kind==='opening_position';const cells=[item.key.split('|')[0],stock?'주식':'현금',stock?(x?.ticker??y?.ticker):(x?.currency??y?.currency),stock?x?.quantity:x?.balance,stock?y?.quantity:y?.balance,stock?x?.averageCostUsd:'—',stock?y?.averageCostUsd:'—',item.status];const tr=document.createElement('tr');for(const v of cells){const td=document.createElement('td');td.textContent=v??'누락';tr.append(td)}tr.lastChild.className=item.status==='MATCH'?'ok':'bad';body.append(tr)}$('status').textContent=(r.status==='ALL_MATCH'?'전체 일치':'차이 확인 필요')+' · 원본 '+r.sourceCount+'건 / 이전 예정 '+r.candidateCount+'건 / 일치 '+r.rows.filter(x=>x.status==='MATCH').length+'건 · 서버 저장 없음';$('status').className=r.status==='ALL_MATCH'?'ok':'bad';}catch(e){body.replaceChildren();$('status').textContent='검증 중단: '+e.message;$('status').className='bad';}};
</script></body></html>
