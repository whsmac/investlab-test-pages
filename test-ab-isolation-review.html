<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST · A/B 격리 점검</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0b1020;color:#edf2ff}body{margin:0}main{max-width:920px;margin:auto;padding:24px 16px}a{color:#a9c5ff}section{border:1px solid #34445e;border-radius:14px;background:#151d30;padding:18px;margin:16px 0}p{line-height:1.6;color:#bac7dc}.item{display:flex;gap:12px;align-items:center;border-bottom:1px solid #33445d;padding:12px 0}.item label{flex:1}.item select{background:#0c1526;color:white;border:1px solid #50627f;border-radius:8px;padding:9px}button{background:#31538a;border:1px solid #6787b7;color:white;padding:12px 16px;border-radius:8px;cursor:pointer}.bad{color:#fca5a5}.small{font-size:13px}</style></head><body><main><a href="./test-migration-preflight.html">← TEST 이전 사전점검</a><h1>A/B 사용자 데이터 격리 점검</h1><p><a href="./test-isolation-evidence-template.html">실측 증거 양식 다운로드 →</a></p><p>각 항목은 실제 TEST 계정으로 검증한 관측 결과를 기록하기 위한 것입니다. 이 페이지 자체는 인증·조회·변경 요청을 보내지 않습니다.</p><section><div id="cases"></div><p id="status" role="status"></p><button id="download">점검 결과 JSON 저장</button></section><section><h2>검증 범위와 한계</h2><p class="bad">입력한 값이 모두 예상과 일치하더라도 서버 측 검증 완료나 데이터 이전 승인을 뜻하지 않습니다.</p><p class="small">향후 승인된 TEST 환경에서 실제 A/B/익명 계정으로 읽기·쓰기·RPC 거부를 확인하고 증거를 대조해야 합니다. 개인 정보, 토큰, 비밀번호를 입력하지 마세요.</p></section></main><script type="module">
import {ISOLATION_CASES,assessIsolationEvidence} from './src/ledger/isolation-evidence-review.mjs';
const root=document.getElementById('cases'),inputs=new Map(),status=document.getElementById('status');
for(const c of ISOLATION_CASES){const row=document.createElement('div');row.className='item';const label=document.createElement('label');label.textContent=c.label+' (기대: '+(c.expected==='ALLOW'?'허용':'차단')+')';const sel=document.createElement('select');for(const [v,t] of [['','미검증'],['ALLOW','실제 허용'],['DENY','실제 차단']]){const o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)}sel.onchange=update;inputs.set(c.id,sel);row.append(label,sel);root.append(row)}
function update(){const r=assessIsolationEvidence(Object.fromEntries([...inputs].map(([id,sel])=>[id,sel.value||null])));status.textContent='상태: '+r.status+' · 실패 '+r.failures.length+'건 · 미검증 '+r.missing.length+'건 · 이전 승인 불가';status.className='bad';return r}
document.getElementById('download').onclick=()=>{const r=update(),blob=new Blob([JSON.stringify(r,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='investlab-test-ab-isolation-review.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};update();
</script></body></html>
