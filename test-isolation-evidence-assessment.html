<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST 격리 증거 검증</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0b1020;color:#edf2ff}main{max-width:950px;margin:auto;padding:24px 16px}a{color:#a9c5ff}section{border:1px solid #34445e;border-radius:14px;background:#151d30;padding:18px;margin:16px 0}p{color:#bac7dc;line-height:1.6}button{background:#31538a;border:1px solid #6787b7;color:white;padding:12px 16px;border-radius:8px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #33445d;text-align:left}.scroll{overflow:auto}.bad{color:#fca5a5}</style></head><body><main><a href="./test-isolation-evidence-template.html">← 증거 양식</a><h1>A/B 격리 증거 자동 검증</h1><p>작성된 TEST 증거 JSON을 선택하면 8개 항목의 결과·검증 방법·증거 참조를 확인합니다. 브라우저 내부에서만 분석합니다.</p><section><input id="file" type="file" accept=".json,application/json"><p id="status" role="status">파일을 선택하세요.</p><div class="scroll"><table><thead><tr><th>항목</th><th>기대</th><th>관측</th><th>판정</th><th>증거 참조</th></tr></thead><tbody id="rows"></tbody></table></div><button id="download" disabled>검토 결과 JSON 저장</button></section><p class="bad">수동 기록의 형식 검증만 수행합니다. 실제 서버 로그·인증 상태를 검증하거나 DB 이전을 승인하지 않습니다.</p></main><script type="module">
import {parseIsolationEvidenceDocument} from './src/ledger/isolation-evidence-assessment.mjs';
const $=id=>document.getElementById(id);let last=null;
$('file').onchange=async e=>{last=null;$('download').disabled=true;$('rows').replaceChildren();const file=e.target.files?.[0];if(!file)return;try{if(file.size>1024*1024)throw Error('파일 크기 제한 1MiB 초과');last=parseIsolationEvidenceDocument(await file.text());for(const c of last.cases){const tr=document.createElement('tr');for(const v of [c.id,c.expected,c.observed??'미검증',c.status,c.evidenceReference??'없음']){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('rows').append(tr)}$('status').textContent='결과: '+last.status+' · 실패 '+last.failures.length+'건 · 미검증 '+last.missing.length+'건 · 서버 검증 미완료';$('download').disabled=false;}catch(err){$('status').textContent='검증 중단: '+err.message}};
$('download').onclick=()=>{if(!last)return;const blob=new Blob([JSON.stringify(last,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='investlab-test-isolation-evidence-assessment.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
