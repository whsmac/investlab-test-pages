<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST · 기업 ID 조회</title>
<style>:root{color-scheme:dark;font:16px system-ui;background:#0b1020;color:#edf2ff}body{margin:0}.wrap{max-width:850px;margin:auto;padding:24px 16px}a{color:#a9c5ff}.panel{background:#141b2d;border:1px solid #2a3550;border-radius:12px;padding:20px;margin-top:20px}button{font:inherit;background:#233657;color:#fff;border:1px solid #566789;padding:12px 18px;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}p{line-height:1.6}</style></head>
<body><main class="wrap"><a href="./index.html">← TEST 홈</a><h1>TEST 기업 ID 조회 · 읽기 전용</h1>
<p>기존 TEST 공유 데이터 로그인 세션으로 기업 ID를 확인합니다. 기업 ID 조회만 수행하며 DB에 데이터를 저장하거나 수정하지 않습니다.</p>
<section class="panel"><button id="check">TEST 기업 ID 조회</button><p id="status" role="status">조회 대기</p><pre id="result"></pre></section>
<p>확인 대상: MSFT, GOOGL, AMZN, META, TSLA. SPCX는 주가 제공처 확인 전까지 자동 수집 대상에서 제외합니다.</p>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">
import {readYahooTestCompanyMap} from "./src/market/read-yahoo-test-company-map.mjs";
const TARGET="https://gopofxyezhwpfxbecrxd.supabase.co";
const $=id=>document.getElementById(id);
$("check").addEventListener("click",async()=>{
 $("check").disabled=true;$("result").textContent="";$("status").textContent="TEST 연결 확인 중…";
 try{
  const config=JSON.parse(localStorage.getItem("investlab_shared_data_connection_v1")||"{}");
  if(config.url!==TARGET||!config.key)throw Error("공유 데이터 화면에서 TEST 서버 연결을 먼저 완료하세요.");
  if(!window.supabase?.createClient)throw Error("Supabase 라이브러리를 불러오지 못했습니다.");
  const client=window.supabase.createClient(TARGET,config.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"investlab_shared_data_auth_v1"}});
  const mapping=await readYahooTestCompanyMap(client);
  $("result").textContent=JSON.stringify(mapping,null,2);
  $("status").textContent="TEST 기업 ID 조회 성공 · DB 변경 0건";
 }catch(error){$("status").textContent="조회 실패: "+error.message}
 finally{$("check").disabled=false}
});
</script></body></html>
