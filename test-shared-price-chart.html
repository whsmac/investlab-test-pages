<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST · 공통 주가 차트</title>
<style>:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#0b1020;color:#edf2ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:22px 16px}a{color:#9ebdff}.panel{background:#141b2d;border:1px solid #2a3550;border-radius:14px;padding:18px;margin:15px 0}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px;color:#aab8d1}select,button{background:#1b2439;color:#edf2ff;border:1px solid #435271;border-radius:8px;padding:10px;font:inherit}button{cursor:pointer}button:disabled{opacity:.5}#status{color:#aab8d1}svg{display:block;width:100%;height:auto;min-height:180px}#details{color:#aab8d1;font-size:13px}h1{font-size:clamp(23px,4vw,30px)}</style></head>
<body><main class="wrap"><a href="./index.html">← TEST 홈</a><h1>공통 주가 차트 · TEST</h1><p>Supabase 공유 주가 데이터를 로그인 계정으로 읽어 표시합니다. CSV 업로드나 서버 쓰기는 하지 않습니다.</p>
<section class="panel"><div class="controls"><label>종목<select id="ticker"><option>MSFT</option><option>GOOGL</option><option>AMZN</option><option>META</option><option>TSLA</option><option>SPCX</option></select></label><label>기간<select id="period"><option value="3m">3개월</option><option value="6m">6개월</option><option value="1y" selected>1년</option><option value="3y">3년</option><option value="all">전체</option></select></label><button id="refresh">주가 불러오기</button></div><p id="status" role="status">연결 확인 대기</p><svg id="chart" viewBox="0 0 900 350" role="img" aria-label="주가 시계열 그래프"><text x="450" y="175" fill="#aab8d1" text-anchor="middle">조회 대기</text></svg><p id="details"></p></section><p>데이터 출처: INVESTLAB TEST Supabase · 저장된 관측값 기준. 최신 시세 자동 갱신은 아직 구현되지 않았습니다.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import {readSharedPriceSeries} from "./src/market/read-shared-price-series.mjs";
const TARGET="https://gopofxyezhwpfxbecrxd.supabase.co", KEY="investlab_shared_data_connection_v1";
const $=id=>document.getElementById(id), ns="http://www.w3.org/2000/svg";
const status=message=>{$("status").textContent=message};
function node(tag,attrs,text){const el=document.createElementNS(ns,tag);for(const [key,val] of Object.entries(attrs))el.setAttribute(key,String(val));if(text!==undefined)el.textContent=text;return el}
function draw(points){
 const svg=$("chart");svg.replaceChildren();
 if(!points.length){svg.append(node("text",{x:450,y:175,fill:"#aab8d1","text-anchor":"middle"},"조회된 주가 데이터가 없습니다."));return}
 const left=75,right=875,top=25,bottom=295;
 let min=Infinity,max=-Infinity;
 for(const p of points){if(p.close<min)min=p.close;if(p.close>max)max=p.close}
 const pad=(max-min||max*.05||1)*.12,lo=Math.max(0,min-pad),hi=max+pad;
 const x=i=>left+(points.length===1?.5:i/(points.length-1))*(right-left),y=v=>bottom-(v-lo)/(hi-lo)*(bottom-top);
 for(let i=0;i<=4;i++){const val=lo+(hi-lo)*i/4,yy=y(val);svg.append(node("line",{x1:left,y1:yy,x2:right,y2:yy,stroke:"#34425d"}));svg.append(node("text",{x:left-9,y:yy+4,fill:"#aab8d1","text-anchor":"end","font-size":12},val.toLocaleString("en-US",{maximumFractionDigits:2})))}
 const path=points.map((p,i)=>(i?"L":"M")+x(i).toFixed(2)+","+y(p.close).toFixed(2)).join(" ");
 svg.append(node("path",{d:path,fill:"none",stroke:"#7ca7ff","stroke-width":2.5,"stroke-linejoin":"round"}));
 for(const i of [0,Math.floor((points.length-1)/2),points.length-1])svg.append(node("text",{x:x(i),y:328,fill:"#aab8d1","text-anchor":i===0?"start":i===points.length-1?"end":"middle","font-size":12},points[i].date));
}
function dateFrom(period){if(period==="all")return undefined;const d=new Date(),months={"3m":3,"6m":6,"1y":12,"3y":36}[period];d.setUTCMonth(d.getUTCMonth()-months);return d.toISOString().slice(0,10)}
async function load(){
 $("refresh").disabled=true;$("details").textContent="";
 try{
  const config=JSON.parse(localStorage.getItem(KEY)||"{}");
  if(config.url!==TARGET||!config.key)throw Error("공유 데이터 화면에서 TEST 프로젝트 연결과 로그인을 먼저 완료하세요.");
  if(!window.supabase?.createClient)throw Error("Supabase 라이브러리 로드 실패");
  const client=window.supabase.createClient(TARGET,config.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"investlab_shared_data_auth_v1"}});
  status("TEST 서버에서 주가 조회 중…");
  const result=await readSharedPriceSeries(client,{ticker:$("ticker").value,from:dateFrom($("period").value)});
  draw(result.points);
  status(result.points.length?result.ticker+" · "+result.points.length.toLocaleString()+"개 관측값 조회 완료":"선택 기간에 데이터가 없습니다.");
  if(result.points.length){
   const first=result.points[0],last=result.points.at(-1);
   const today=new Date(),lastDay=new Date(last.date+"T00:00:00Z");
   const ageDays=Math.floor((Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),today.getUTCDate())-lastDay.getTime())/86400000);
   const currencies=new Set(result.points.map(p=>p.currency||"미표시"));
   const bases=new Set(result.points.map(p=>p.basis||"미표시"));
   const mixed=(currencies.size>1?" · ⚠ 통화 혼재("+[...currencies].join(", ")+")":"")+(bases.size>1?" · ⚠ 주가 기준 혼재("+[...bases].join(", ")+")":"");
   const stale=ageDays>7?" · ⚠ 저장된 주가가 "+ageDays+"일 전 데이터입니다 (실시간 시세 아님)":" · 마지막 저장일 "+last.date+" (실시간 시세 아님)";
   $("details").textContent=first.date+" ~ "+last.date+" · 최근 저장 종가 "+last.close.toLocaleString("en-US")+" "+(last.currency||"")+" · "+(last.basis||"기준 미표시")+stale+mixed+(result.truncated?" · 최대 조회 건수 도달 (일부만 표시)":"");
  }
 }catch(error){status("조회 실패: "+error.message);draw([])}
 finally{$("refresh").disabled=false}
}
$("refresh").addEventListener("click",load);$("ticker").addEventListener("change",load);$("period").addEventListener("change",load);void load();
</script></body></html>
