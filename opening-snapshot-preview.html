<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST · 계좌별 기초잔고 미리보기</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b1020;color:#edf2ff}body{margin:0}main{max-width:920px;margin:auto;padding:22px 16px 60px}a{color:#9bbdff}h1{font-size:25px}p{line-height:1.6;color:#b7c5df}section{border:1px solid #34445e;background:#151d30;border-radius:14px;padding:18px;margin:16px 0}label{display:block;margin:10px 0;color:#d8e4f7}textarea{box-sizing:border-box;width:100%;min-height:160px;background:#0d1526;border:1px solid #536782;color:#edf2ff;border-radius:8px;padding:12px;font:13px ui-monospace,monospace}button{background:#31538a;color:white;border:1px solid #6684b5;padding:11px 16px;border-radius:8px;cursor:pointer}button:hover{background:#40649d}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace,monospace;background:#0d1526;padding:14px;border-radius:8px}strong{color:#fff}.warn{color:#f3d38c}.status{font-weight:600}</style></head><body><main><nav><a href="./portfolio-migration-check.html">← 포트폴리오 이관 점검</a></nav><h1>계좌별 기초잔고 미리보기</h1><p>계좌 ID, 종목별 보유수량과 평균취득단가, 현금잔고를 JSON 형식으로 입력해 구조를 점검합니다. <strong>어떤 값도 저장하거나 서버로 전송하지 않습니다.</strong></p><section><h2>샘플 또는 직접 입력</h2><p>아래는 가상 데이터입니다. 실제 계좌 ID가 아닌 예시 UUID이며, 실계좌에 연결되지 않습니다.</p><label for="positions">보유주식(JSON 배열)</label><textarea id="positions" spellcheck="false">[
  {"accountId":"123e4567-e89b-12d3-a456-426614174000","ticker":"TSLA","quantity":"10","averageCostUsd":"250"},
  {"accountId":"123e4567-e89b-12d3-a456-426614174001","ticker":"TSLA","quantity":"2","averageCostUsd":"300"}
]</textarea><label for="cash">현금잔고(JSON 배열)</label><textarea id="cash" spellcheck="false">[
  {"accountId":"123e4567-e89b-12d3-a456-426614174000","currency":"USD","balance":"5000"},
  {"accountId":"123e4567-e89b-12d3-a456-426614174001","currency":"KRW","balance":"1000000"}
]</textarea><button id="preview" type="button">이관 자료 검증하기</button><p id="status" class="status" role="status">미리보기 대기</p></section><section><h2>검증 결과</h2><pre id="result">아직 계산하지 않았습니다.</pre><p class="warn">이 미리보기는 계좌 소유권을 검증하지 않습니다. 실제 이관 전 TEST Supabase 인증·RLS 검증과 취득원가 확인이 반드시 필요합니다.</p></section></main><script type="module">import {buildOpeningSnapshot} from './src/ledger/opening-snapshot-preview.mjs';const el=id=>document.getElementById(id);el('preview').addEventListener('click',()=>{try{const positions=JSON.parse(el('positions').value),cash=JSON.parse(el('cash').value);const result=buildOpeningSnapshot({positions,cash});el('status').textContent='검증 완료 · '+result.rows.length+'개 기초잔고 항목 · 업로드 없음';el('result').textContent=JSON.stringify(result,null,2);}catch(error){el('status').textContent='검증 실패 · 데이터는 저장되지 않았습니다.';el('result').textContent=error.message;}});</script></body></html>
