<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST · 보유종목 JSON 내보내기</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0b1020;color:#edf2ff}body{margin:0}main{max-width:800px;margin:auto;padding:24px 16px}a{color:#a9c5ff}section{border:1px solid #34445e;border-radius:14px;background:#151d30;padding:18px;margin:16px 0}p{line-height:1.65;color:#bac7dc}button{background:#31538a;border:1px solid #6787b7;color:white;padding:12px 16px;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}pre{background:#0c1526;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}.warn{color:#f5d18a}</style></head><body><main><a href="./opening-snapshot-guided.html">← 기초잔고 간편 입력</a><h1>보유종목 JSON 내보내기</h1><p>현재 사이트의 <code>investlab_holdings</code> 값을 읽어 검증한 뒤 JSON 파일로 내려받습니다. 저장소 변경이나 서버 전송은 하지 않습니다.</p><p><a href="./holdings-migration-compare.html">내보낸 파일을 종목별 비교표로 검증하기 →</a></p><section><h2>파일 생성</h2><button id="inspect">보유종목 검증</button> <button id="download" disabled>JSON 파일 저장</button><p id="status" role="status">검증 전</p><pre id="preview"></pre></section><section><p class="warn">이 도구는 현재 사이트와 동일한 주소의 저장소만 읽습니다. 원본 대시보드가 다른 주소라면 원본 페이지에서 별도로 실행할 수 있는 통합 작업이 필요합니다. 계좌별 구분이 없는 기존 보유종목은 이 파일에서도 계좌를 임의로 추정하지 않습니다.</p></section></main><script type="module">
import {serializeLegacyHoldingsExport} from './src/ledger/legacy-holdings-export.mjs';
const $=id=>document.getElementById(id);let payload=null;
$('inspect').onclick=()=>{payload=null;$('download').disabled=true;try{const holdings=JSON.parse(localStorage.getItem('investlab_holdings')||'[]');payload=serializeLegacyHoldingsExport(holdings);$('preview').textContent=payload;$('status').textContent='검증 완료 · 내보내기 준비';$('download').disabled=false;}catch(e){$('preview').textContent='';$('status').textContent='내보내기 중단: '+e.message;}};
$('download').onclick=()=>{if(!payload)return;const blob=new Blob([payload],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='investlab-holdings-export.json';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);};
</script></body></html>
