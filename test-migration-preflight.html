<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INVESTLAB TEST · 이전 사전점검</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0b1020;color:#edf2ff}body{margin:0}main{max-width:880px;margin:auto;padding:24px 16px}a{color:#a9c5ff}section{border:1px solid #34445e;border-radius:14px;background:#151d30;padding:18px;margin:16px 0}p{line-height:1.6;color:#bac7dc}.item{display:flex;gap:12px;align-items:center;border-bottom:1px solid #33445d;padding:12px 0}.item label{flex:1}.item select{background:#0c1526;color:white;border:1px solid #50627f;border-radius:8px;padding:9px}button{background:#31538a;border:1px solid #6787b7;color:white;padding:12px 16px;border-radius:8px;cursor:pointer}.bad{color:#fca5a5}.ok{color:#86efac}.small{font-size:13px}</style></head><body><main><a href="./opening-snapshot-compare.html">← 기초잔고 검토</a><h1>TEST Supabase 이전 사전점검</h1><p>실제 DB 이전 전에 확인할 안전조건입니다. 항목 선택은 검토 기록일 뿐, 서버 검증의 증거 또는 SQL 실행 승인으로 인정되지 않습니다.</p><section><h2>점검표</h2><div id="checks"></div><p id="status" role="status">점검 전</p><button id="download">점검표 JSON 저장</button></section><section><h2>안전 제한</h2><p class="bad">이 화면에는 SQL 실행, 데이터 업로드, PR 병합 기능이 없습니다. 모든 항목을 확인해도 별도 사용자 승인과 서버 측 실제 검증이 필요합니다.</p><p class="small">실측 항목은 TEST 프로젝트에서 별도로 확인한 증거를 토대로 판단해야 합니다. 단순히 드롭다운에서 완료를 선택했다고 검증이 수행되지는 않습니다.</p></section></main><script type="module">
import {TEST_PREFLIGHT_CHECKS,assessTestMigrationPreflight} from './src/ledger/test-migration-preflight.mjs';
const root=document.getElementById('checks'),inputs=new Map(),status=document.getElementById('status');
for(const c of TEST_PREFLIGHT_CHECKS){const row=document.createElement('div');row.className='item';const label=document.createElement('label');label.textContent=c.label+' ('+(c.kind==='server'?'서버 실측 필요':'수동 확인')+')';const sel=document.createElement('select');for(const [v,t] of [['','미확인'],['yes','증거 확인'],['no','실패']]){const o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)}sel.onchange=update;inputs.set(c.id,sel);row.append(label,sel);root.append(row)}
function evidence(){return Object.fromEntries([...inputs].map(([id,sel])=>[id,sel.value==='yes'?true:sel.value==='no'?false:null]))}
function update(){const r=assessTestMigrationPreflight(evidence());status.textContent=(r.status==='BLOCKED'?'이전 차단':'별도 승인 검토 가능')+' · 미충족 '+r.blockers.length+'건 · SQL 실행 및 업로드 불가';status.className=r.status==='BLOCKED'?'bad':'ok';return r}
document.getElementById('download').onclick=()=>{const r=update();const payload={format:'INVESTLAB_TEST_PREFLIGHT_REVIEW_V1',...r,warning:'Self-reported selections only; external verification required.'};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='investlab-test-preflight-review.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};update();
</script></body></html>
